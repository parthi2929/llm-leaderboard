<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LLM Leaderboard — Live Charts</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;min-height:100vh}
  #app{display:flex;gap:12px;align-items:flex-start;max-width:1700px;margin:0 auto;padding:8px 12px 16px}
  #main{flex:1;min-width:0}
  #sidebar{flex:0 0 210px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;
           background:#1e293b;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
  #sidebar.collapsed{flex-basis:38px;padding:10px 6px}
  #sidebar.collapsed .sb-body,#sidebar.collapsed .sb-title{display:none}
  .sb-head{display:flex;align-items:center;justify-content:space-between}
  .sb-title{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
  #sb-toggle{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  #sb-toggle:hover{color:#f1f5f9}
  .sb-body{display:flex;flex-direction:column;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field>label{font-size:11px;color:#94a3b8}
  .row{display:flex;align-items:center;gap:8px}
  select{width:100%;background:#0f172a;color:#f1f5f9;border:1px solid #334155;border-radius:5px;padding:4px 6px;font-size:12px}
  input[type=range]{flex:1;min-width:0}
  .check{font-size:12px;color:#cbd5e1;cursor:pointer;display:flex;align-items:center;gap:6px}
  .btn{width:100%;color:white;border:none;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
  #refresh-btn{background:#1d4ed8} #refresh-btn:hover{background:#2563eb}
  #clear-btn{background:#334155} #clear-btn:hover{background:#475569}
  #export-btn{background:#047857} #export-btn:hover{background:#059669}
  .info{font-size:11px;color:#64748b;line-height:1.5}
  .info a{color:#818cf8}
  #status{font-size:11px;padding:5px 8px;border-radius:6px}
  #status.loading{background:#1e3a5f;color:#7dd3fc}
  #status.ok{background:#14532d;color:#86efac}
  #status.err{background:#450a0a;color:#fca5a5}
  #chart-wrap{position:relative;width:100%}
  canvas{display:block;width:100%}
  #hit{position:absolute;top:0;left:0;width:100%;cursor:grab}
  #hit:active{cursor:grabbing}
  @media (max-width:700px){
    #app{flex-direction:column}
    #sidebar{position:static;flex-basis:auto;width:100%;max-height:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-title">Controls</span>
      <button id="sb-toggle" title="Collapse / expand" onclick="app.toggleSidebar()">◀</button>
    </div>
    <div class="sb-body">
      <div class="field">
        <label for="orient">Orientation</label>
        <select id="orient">
          <option value="vertical">Vertical</option>
          <option value="horizontal">Horizontal</option>
        </select>
      </div>
      <div class="field">
        <label for="topN">Top N</label>
        <div class="row">
          <input type="range" id="topN" min="10" max="50" value="30" step="5">
          <span id="topNVal" style="font-size:12px;min-width:20px">30</span>
        </div>
      </div>
      <div class="field">
        <label for="sortBy">Sort</label>
        <select id="sortBy">
          <option value="intel">Intelligence</option>
          <option value="price">Price ↑</option>
          <option value="priceDesc">Price ↓</option>
        </select>
      </div>
      <div class="field">
        <label for="filterOpen">Weights</label>
        <select id="filterOpen">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="field">
        <label for="filterCreator">Company</label>
        <select id="filterCreator">
          <option value="all">All</option>
        </select>
      </div>
      <label class="check" for="includeNoPrice">
        <input type="checkbox" id="includeNoPrice">
        Unpriced <span id="noPriceCount" style="color:#64748b"></span>
      </label>
      <button class="btn" id="refresh-btn" onclick="app.refresh()">Refresh</button>
      <button class="btn" id="clear-btn" onclick="app.clearPins()">Clear lines</button>
      <button class="btn" id="export-btn" onclick="app.copyPNG()">Copy PNG</button>
      <div id="status" class="loading">Loading…</div>
      <div class="info">
        Click a model to add or remove a line. Esc clears all.<br>
        Data: <a href="https://artificialanalysis.ai/leaderboards/models" target="_blank">artificialanalysis.ai</a><br>
        Open/closed: <a href="https://huggingface.co" target="_blank">Hugging Face</a><br>
        <span id="last-updated"></span><br>
        <span id="build">__BUILD_SHA__</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="chart-wrap">
      <canvas id="base"></canvas>
      <canvas id="hit"></canvas>
    </div>
  </main>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
// Data is scraped server-side by a scheduled GitHub Action (scripts/scrape.mjs)
// and committed to data.json next to this page. We load that static, same-origin
// file — no CORS proxies, no client-side scraping. The embedded SNAPSHOT below is
// the offline fallback if data.json is ever missing.
const DATA_URL   = './data.json';
const AA_URL     = 'https://artificialanalysis.ai/leaderboards/models';
const REFRESH_MS = 30 * 60 * 1000; // re-read data.json every 30 minutes

// Embedded snapshot (top 60 by intelligence) used as a fallback so the charts
// always render even when every live proxy is unreachable. Format: [model, creator, intel, price].
const SNAPSHOT = [["Claude Opus 4.8 (max)","Anthropic",61,4.1],["GPT-5.5 (xhigh)","OpenAI",60,4.35],["GPT-5.5 (high)","OpenAI",59,4.35],["Claude Opus 4.7 (max)","Anthropic",57,4.1],["Gemini 3.1 Pro Preview","Google",57,1.74],["GPT-5.5 (medium)","OpenAI",57,4.35],["Qwen3.7 Max","Alibaba",57,1.43],["Gemini 3.5 Flash","Google",55,1.31],["Gemini 3.5 Flash (medium)","Google",55,1.31],["MiniMax-M3","MiniMax",55,0.22],["Kimi K2.6","Kimi",54,0.7],["MiMo-V2.5-Pro","Xiaomi",54,0.18],["GPT-5.3 Codex (xhigh)","OpenAI",54,1.87],["Qwen3.7 Plus","Alibaba",53,0.25],["Grok 4.3 (high)","xAI",53,0.64],["Claude Opus 4.7 (Non-reasoning, high)","Anthropic",52,4.1],["Claude Sonnet 4.6 (max)","Anthropic",52,2.46],["DeepSeek V4 Pro (Max)","DeepSeek",52,0.18],["GLM-5.1","Z AI",51,0.9],["GPT-5.5 (low)","OpenAI",51,4.35],["Qwen3.6 Plus","Alibaba",50,0.43],["DeepSeek V4 Pro (High)","DeepSeek",50,0.18],["MiniMax-M2.7","MiniMax",50,0.22],["MiMo-V2.5","Xiaomi",49,0.06],["GPT-5.4 mini (xhigh)","OpenAI",49,0.65],["Grok 4.3 (medium)","xAI",49,0.64],["Nemotron 3 Ultra","NVIDIA",48,0.52],["DeepSeek V4 Flash (Max)","DeepSeek",47,0.06],["DeepSeek V4 Flash (High)","DeepSeek",46,0.08],["Qwen3.6 27B","Alibaba",46,0.9],["Qwen3.5 397B A17B","Alibaba",45,0.9],["MiMo-V2-Omni-0327","Xiaomi",45,0.34],["Claude Sonnet 4.6 (Non-reasoning)","Anthropic",44,2.46],["GPT-5.4 nano (xhigh)","OpenAI",44,0.18],["GLM-5.1","Z AI",44,0.9],["Qwen3.6 35B A3B","Alibaba",43,0.37],["MiMo-V2-Omni","Xiaomi",43,0],["Gemini 3.5 Flash (minimal)","Google",43,1.31],["Kimi K2.6","Kimi",43,0.7],["Claude Sonnet 4.6 (Non-reasoning, Low Effort)","Anthropic",43,2.46],["Step 3.7 Flash","StepFun",43,0.18],["Hy3-preview","Tencent",42,0.1],["GPT-5.5 Instant (May 2026)","OpenAI",42,4.35],["Qwen3.5 122B A10B","Alibaba",42,0.68],["MiMo-V2-Flash (Feb 2026)","Xiaomi",41,0.06],["GPT-5.5 (Non-reasoning)","OpenAI",41,4.35],["Qwen3.5 397B A17B","Alibaba",40,0.9],["DeepSeek V4 Pro","DeepSeek",39,0.18],["Mistral Medium 3.5","Mistral",39,2.1],["Gemma 4 31B","Google",39,0],["Qwen3.5 Omni Plus","Alibaba",39,0.84],["Step 3.5 Flash 2603","StepFun",38,0.06],["Ring-2.6-1T","InclusionAI",38,0.52],["o3","OpenAI",38,1.55],["GPT-5.4 nano","OpenAI",38,0.18],["GPT-5.4 mini (medium)","OpenAI",38,0.65],["Command A+","Cohere",37,0],["Qwen3.6 27B","Alibaba",37,0.9],["Claude 4.5 Haiku","Anthropic",37,0.82],["DeepSeek V4 Flash","DeepSeek",36,0.06]];

// HF model search strings per known creator → maps to HF org slug for lookup
// Used to confirm open-weights status via HF API
const HF_ORG_MAP = {
  'alibaba': 'Qwen',
  'deepseek': 'deepseek-ai',
  'xiaomi': 'XiaomiMiMo',
  'minimax': 'MiniMaxAI',
  'kimi': 'moonshotai',
  'nvidia': 'nvidia',
  'zhipu': 'THUDM',
  'z ai': 'THUDM',
  'meta': 'meta-llama',
  'mistral': 'mistralai',
  'google': null,      // Google models are closed (Gemini); open ones are explicit
  'openai': null,      // closed
  'anthropic': null,   // closed
  'xai': null,         // closed
  'cohere': null,      // closed
  'amazon': null,      // closed
};

// Definitive known-open creator names (case-insensitive match)
// These are orgs that release model weights publicly
const KNOWN_OPEN_CREATORS = new Set([
  'alibaba','deepseek','xiaomi','minimax','kimi','nvidia','meta',
  'mistral','ibm','lg ai research','perplexity','upstage','liquid ai',
  'prime intellect','inclusionai','stepfun','tencent','baidu',
  'openai-open', // gpt-oss models have open weights
  'zhipu','z ai','korea telecom','arcee ai','motif technologies',
  'swiss ai initiative','reka ai','cohere-open','sarvam',
]);

// Definitive known-closed creators
const KNOWN_CLOSED_CREATORS = new Set([
  'openai','anthropic','google','xai','amazon','cohere','ai21 labs',
  'minimax-closed','longcat',
]);

// Overrides for specific model names (exact match after lowercase)
// Used when creator alone is ambiguous
const MODEL_OVERRIDES = {
  // MiniMax has open-weight models
  'minimax-m3': true,
  'minimax-m2.7': true,
  // GLM is open (THUDM)
  'glm-5.1': true,
  // gpt-oss models are open
  'gpt-oss-120b (high)': true,
  'gpt-oss-120b (low)': true,
  'gpt-oss-20b (high)': true,
  'gpt-oss-20b (low)': true,
  // Gemma is open (Google open-source)
  'gemma 4 31b': true,
  'gemma 4 26b a4b': true,
  'gemma 4 e4b': true,
  'gemma 4 e2b': true,
  'gemma 3 270m': true,
  // Llama variants
  'llama 4 scout': true,
  'llama 4 maverick': true,
  'llama 3.3 70b': true,
  'llama 3.1 405b': true,
  'llama 3.2 90b (vision)': true,
  'llama 3.2 11b (vision)': true,
  // Command A is closed, but Cohere has some open
  'command a': false,
  'command a+': false,
  // Granite is open (IBM)
  'granite 4.1 30b': true,
  'granite 4.1 8b': true,
  'granite 4.1 3b': true,
  'granite 4.0 h small': true,
  'granite 4.0 micro': true,
  'granite 4.0 350m': true,
  'granite 4.0 1b': true,
  'granite 4.0 h 1b': true,
  'granite 4.0 h 350m': true,
  // Phi is open (Microsoft)
  'phi-4': true,
  'phi-4 multimodal': true,
  'phi-4 mini': true,
  // Devstral is open (Mistral)
  'devstral 2': true,
  'devstral small 2': true,
  // Nova is closed (Amazon)
  'nova premier': false,
  'nova 2.0 pro preview': false,
  'nova 2.0 lite': false,
  'nova micro': false,
  // Qwen all open
  'qwen3.7 max': true,
  'qwen3.7 plus': true,
  // Grok closed
  'grok 4.3 (high)': false,
  'grok 4.3 (medium)': false,
  'grok 4.3 (non-reasoning)': false,
};

// ─── STATE ────────────────────────────────────────────────────────────────────
const app = {
  allData: [],
  openCache: {},   // model_name_lower → true/false
  hfCache: {},     // creator_lower → Promise<bool>
  lastFetch: null,
  rafPending: false,
  lastIdx: -1,     // model index under the cursor while hovering/scrubbing
  hoverIdx: -1,    // model index for the transient hover preview line
  pins: [],        // pinned model indices — each is a persistent comparison line
  dragging: false, // true while a line is being dragged/scrubbed before drop

  // Distinct colors cycled across comparison lines so each is identifiable.
  LINE_COLORS: ['#ef4444','#22d3ee','#a3e635','#f472b6','#fb923c','#c084fc','#facc15','#2dd4bf'],
  colorFor(order) { return this.LINE_COLORS[order % this.LINE_COLORS.length]; },

  // Label highlight for a selected model. The background is a light color with
  // the highest contrast against a dark shade of the label's own hue: yellow
  // behind dark red (closed), light magenta behind dark green (open).
  LABEL_HI: {
    open:   { bg: '#f5d0fe', fg: '#14532d' },
    closed: { bg: '#fde047', fg: '#991b1b' },
  },

  // Layout constants (recomputed on draw)
  ML: 72, MR: 20, MT: 55, CH: 260, MB_IN: 6, GAP: 50, LBL_H: 145,
  CW: 1260,

  setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
  },

  // ── Determine if a model is open weights ─────────────────────────────────
  isOpen(modelName, creatorName) {
    const ml = modelName.toLowerCase();
    const cl = creatorName.toLowerCase().trim();

    // 1. Direct model override
    for (const [k, v] of Object.entries(MODEL_OVERRIDES)) {
      if (ml.startsWith(k) || ml === k) return v;
    }

    // 2. Known closed creator
    if (KNOWN_CLOSED_CREATORS.has(cl)) return false;

    // 3. Known open creator
    if (KNOWN_OPEN_CREATORS.has(cl)) return true;

    // 4. Partial creator match
    for (const oc of KNOWN_OPEN_CREATORS) {
      if (cl.includes(oc) || oc.includes(cl)) return true;
    }
    for (const cc of KNOWN_CLOSED_CREATORS) {
      if (cl.includes(cc) || cc.includes(cl)) return false;
    }

    // 5. Default unknown → treat as closed (conservative)
    return false;
  },

  // ── Parse the leaderboard HTML into model records ─────────────────────────
  // Map tuples into full records. data.json carries an authoritative open flag
  // as a 5th element (resolved server-side via curated lists + Hugging Face); the
  // embedded snapshot has 4 elements, so fall back to the local heuristic there.
  mapTuples(tuples) {
    // price is null when Artificial Analysis has not published one yet.
    return tuples.map(([model, creator, intel, price, open]) => ({
      model, creator, intel,
      price: typeof price === 'number' ? price : null,
      open: typeof open === 'boolean' ? open : this.isOpen(model, creator)
    }));
  },

  // ── Rebuild the Company filter options from the loaded data ───────────────
  // Runs whenever a new dataset lands (snapshot or data.json). Shows per-company
  // model counts and preserves the current selection when the company still exists.
  populateCreatorFilter() {
    const sel = document.getElementById('filterCreator');
    const prev = this.prefs.filterCreator || sel.value || 'all';
    const counts = new Map();
    for (const d of this.allData) counts.set(d.creator, (counts.get(d.creator) || 0) + 1);
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const creators = [...counts.keys()].sort((a, b) => a.localeCompare(b));
    sel.innerHTML = '<option value="all">All</option>' +
      creators.map(c =>
        `<option value="${esc(c)}">${esc(c)} (${counts.get(c)})</option>`
      ).join('');
    sel.value = (prev === 'all' || creators.includes(prev)) ? prev : 'all';
  },

  // ── Load the embedded snapshot as a fallback ──────────────────────────────
  loadSnapshot() {
    this.allData = this.mapTuples(SNAPSHOT);
    this.populateCreatorFilter();
    this.draw();
  },

  // ── Load leaderboard from the committed data.json (same origin) ────────────
  async fetchData() {
    this.setStatus('Loading…', 'loading');
    try {
      // Cache-bust so a freshly committed data.json is picked up promptly.
      const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const payload = await res.json();
      const tuples = Array.isArray(payload) ? payload : payload.models;
      if (!Array.isArray(tuples) || tuples.length === 0) throw new Error('no rows in data.json');

      this.allData = this.mapTuples(tuples);
      this.populateCreatorFilter();
      this.lastFetch = payload.updated ? new Date(payload.updated) : new Date();

      const openCount = this.allData.filter(d => d.open).length;
      const n = this.allData.length;
      const noPrice = this.allData.filter(d => d.price === null).length;
      document.getElementById('noPriceCount').textContent =
        noPrice ? '(' + noPrice + ')' : '';
      document.getElementById('last-updated').textContent =
        'Updated ' + this.lastFetch.toLocaleString();
      this.setStatus(n + ' models · ' + openCount + ' open · ' + (n - openCount) + ' closed', 'ok');
      this.draw();
    } catch (e) {
      // data.json missing/unreachable → keep the embedded snapshot.
      console.error('Could not load data.json:', e);
      if (this.allData.length === 0) this.loadSnapshot();
      const n = this.allData.length;
      document.getElementById('last-updated').textContent =
        'Snapshot (' + n + ' models)';
      this.setStatus('data.json failed (' + e.message + ')', 'err');
      if (n > 0) this.draw();
    }
  },

  // ── Get display data (filtered + sorted + top N) ─────────────────────────
  getDisplayData() {
    const topN    = parseInt(document.getElementById('topN').value);
    const sortBy  = document.getElementById('sortBy').value;
    const filterO = document.getElementById('filterOpen').value;
    const creatorF = document.getElementById('filterCreator').value;
    const withNoPrice = document.getElementById('includeNoPrice').checked;

    let data = [...this.allData];
    if (!withNoPrice) data = data.filter(d => d.price !== null);
    if (filterO === 'open')   data = data.filter(d => d.open);
    if (filterO === 'closed') data = data.filter(d => !d.open);
    if (creatorF !== 'all')   data = data.filter(d => d.creator === creatorF);

    // Sort. Price-less models have no rank on a price axis, so they always go
    // last on both price sorts instead of colliding at zero.
    const byPrice = (a, b, dir) => {
      if (a.price === null && b.price === null) return b.intel - a.intel;
      if (a.price === null) return 1;
      if (b.price === null) return -1;
      return dir * (a.price - b.price);
    };
    if (sortBy === 'intel')     data.sort((a,b) => b.intel - a.intel);
    if (sortBy === 'price')     data.sort((a,b) => byPrice(a, b,  1));
    if (sortBy === 'priceDesc') data.sort((a,b) => byPrice(a, b, -1));

    return data.slice(0, topN);
  },

  // ── Draw charts ───────────────────────────────────────────────────────────
  draw() {
    const data = this.getDisplayData();
    if (!data.length) return;

    // Redrawing resizes (and clears) the overlay canvas. Preserve comparison
    // lines across re-renders (sort/filter/topN/refresh) by model identity, so
    // they re-attach to the same models wherever those now sit (or drop out if
    // a model is no longer visible).
    const prevKeys = (this._layout && this.pins.length)
      ? this.pins.map(i => this._layout.data[i]).filter(Boolean).map(d => d.model + '|' + d.creator)
      : [];
    this.pins = prevKeys
      .map(key => data.findIndex(d => d.model + '|' + d.creator === key))
      .filter(i => i >= 0);
    this.lastIdx = -1;
    this.hoverIdx = -1;
    this.dragging = false;

    // Scale the price axis on real prices only; null prices draw as zero-height.
    const priced = data.map(d=>d.price).filter(p => p !== null);
    const maxP = (priced.length ? Math.max(...priced) : 1) * 1.12;
    const maxI = Math.max(...data.map(d=>d.intel)) * 1.08;

    if (document.getElementById('orient').value === 'vertical') this._drawVertical(data, maxP, maxI);
    else this._drawHorizontal(data, maxP, maxI);

    this.bindHover();
    this._render();   // repaint any comparison lines preserved across the redraw
  },

  // Resize both canvases to the layout and return the cleared base context.
  _resetCanvases(CW, TOTAL_H) {
    const base = document.getElementById('base');
    const hit  = document.getElementById('hit');
    base.width = CW; base.height = TOTAL_H;
    hit.width  = CW; hit.height  = TOTAL_H;
    const b = base.getContext('2d');
    b.fillStyle = '#0f172a';
    b.fillRect(0, 0, CW, TOTAL_H);
    return b;
  },

  // Page title + open/closed legend across the top of the canvas.
  _drawHeader(b, CW, MR) {
    b.fillStyle = '#f1f5f9'; b.font = 'bold 15px Segoe UI,Arial'; b.textAlign = 'center';
    b.fillText('LLM Leaderboard — Live Data from artificialanalysis.ai', CW/2, 22);
    const lgX = CW/2 - 140;
    b.fillStyle = '#4ade80'; b.beginPath(); b.arc(lgX, 37, 5, 0, Math.PI*2); b.fill();
    b.fillStyle = '#4ade80'; b.font = '11px Arial'; b.textAlign = 'left';
    b.fillText('Open weights', lgX+9, 41);
    b.fillStyle = '#f87171'; b.beginPath(); b.arc(lgX+105, 37, 5, 0, Math.PI*2); b.fill();
    b.fillStyle = '#f87171'; b.fillText('Closed / proprietary', lgX+114, 41);
    b.fillStyle = '#475569'; b.textAlign = 'right';
    b.fillText('Open/closed via Hugging Face taxonomy', CW-MR, 41);
  },

  // ── Horizontal: models as columns, price chart above intelligence chart ──
  _drawHorizontal(data, maxP, maxI) {
    const { ML, MR, MT, CH, MB_IN, GAP, CW } = this;
    const N = data.length;

    // The rotated-label band is as tall as the longest model name (capped).
    const m = document.getElementById('base').getContext('2d');
    m.font = 'bold 11px Arial';
    const LBL_H = Math.max(this.LBL_H, Math.min(340, Math.max(...data.map(d => m.measureText(d.model).width))) + 24);
    const TOTAL_H = MT + CH + MB_IN + GAP + MT + CH + LBL_H + 20;
    const stepX = (CW - ML - MR) / N;
    const barW  = stepX * 0.68;
    const c1Y   = MT;
    const c2Y   = MT + CH + MB_IN + GAP + MT;

    const mxFn = i => ML + i*stepX + (stepX-barW)/2;
    const cxFn = i => ML + i*stepX + stepX/2;

    this._layout = { orient: 'horizontal', data, N, stepX, barW, c1Y, c2Y, maxP, maxI, CW, TOTAL_H,
                     ML, MR, MT, CH, GAP, MB_IN, LBL_H, mxFn, cxFn };

    const b = this._resetCanvases(CW, TOTAL_H);
    this._drawHeader(b, CW, MR);

    const drawChart = (yOff, vals, maxV, title, yLbl, ct, cb2, fmtFn, xlabels) => {
      const yBot = yOff + CH;
      b.fillStyle = '#1e293b';
      b.beginPath();
      b.roundRect(6, yOff-MT+8, CW-12, MT+CH+(xlabels ? LBL_H+10 : MB_IN+6), 12);
      b.fill();
      b.fillStyle = '#f1f5f9'; b.font = 'bold 13px Segoe UI,Arial'; b.textAlign = 'center';
      b.fillText(title, CW/2, yOff-MT+30);
      for (let g=0; g<=5; g++) {
        const gy = yBot-(g/5)*CH, val = maxV*g/5;
        b.strokeStyle='rgba(148,163,184,0.1)'; b.lineWidth=1;
        b.beginPath(); b.moveTo(ML,gy); b.lineTo(CW-MR,gy); b.stroke();
        b.fillStyle='#64748b'; b.font='11px Arial'; b.textAlign='right';
        b.fillText(fmtFn(val), ML-7, gy+4);
      }
      b.save(); b.translate(15,yOff+CH/2); b.rotate(-Math.PI/2);
      b.fillStyle='#94a3b8'; b.font='12px Arial'; b.textAlign='center';
      b.fillText(yLbl,0,0); b.restore();
      b.strokeStyle='#334155'; b.lineWidth=1.5;
      b.beginPath(); b.moveTo(ML,yOff); b.lineTo(ML,yBot); b.lineTo(CW-MR,yBot); b.stroke();
      vals.forEach((v,i) => {
        // A null value (no published price) is a zero-height bar labelled n/a,
        // which stays distinct from a real $0.00 bar.
        const na = v === null;
        const bh=na ? 0 : (v/maxV)*CH, bx=mxFn(i), by=yBot-bh;
        if (!na) {
          const g=b.createLinearGradient(bx,by,bx,by+bh);
          g.addColorStop(0,ct); g.addColorStop(1,cb2);
          b.fillStyle=g; b.beginPath(); b.roundRect(bx,by,barW,bh,[3,3,0,0]); b.fill();
        }
        b.fillStyle=na ? '#64748b' : '#e2e8f0'; b.font='bold 9px Arial'; b.textAlign='center';
        b.fillText(na ? 'n/a' : fmtFn(v), bx+barW/2, Math.max(by-3,yOff+11));
        b.strokeStyle='#334155'; b.lineWidth=1;
        b.beginPath(); b.moveTo(cxFn(i),yBot); b.lineTo(cxFn(i),yBot+4); b.stroke();
      });
      if (xlabels) {
        vals.forEach((_,i) => {
          const isOpen = data[i].open;
          b.fillStyle = isOpen ? '#4ade80' : '#f87171';
          b.beginPath(); b.arc(cxFn(i), yBot+5, 3, 0, Math.PI*2); b.fill();
          this._drawLabel(b, i, null);
        });
      }
    };

    // Connectors
    for (let i=0; i<N; i++) {
      const x = cxFn(i);
      b.strokeStyle='rgba(51,65,85,0.4)'; b.setLineDash([2,5]); b.lineWidth=1;
      b.beginPath(); b.moveTo(x,c1Y+CH+MB_IN); b.lineTo(x,c2Y); b.stroke();
      b.setLineDash([]);
    }

    drawChart(c1Y, data.map(d=>d.price), maxP,
      'Chart 1 · Blended Price (USD / 1M Tokens)', 'USD / 1M Tokens',
      '#fb923c','#7c2d12', v=>'$'+v.toFixed(2), false);
    drawChart(c2Y, data.map(d=>d.intel), maxI,
      'Chart 2 · Artificial Analysis Intelligence Index (AAII)', 'Intelligence Score',
      '#818cf8','#312e81', v=>Math.round(v)+'', true);
  },

  // ── Vertical: models as rows, intelligence chart left, price chart right ──
  _drawVertical(data, maxP, maxI) {
    const { CW, MR } = this;
    const N = data.length;
    const HDR = 55, PT = 40, ROW = 22, AX = 48;   // header, panel title band, row height, axis band
    const barH = ROW * 0.68;

    // The model-name column is as wide as the longest name (capped).
    const m = document.getElementById('base').getContext('2d');
    m.font = 'bold 11px Arial';
    const labW = Math.min(340, Math.max(...data.map(d => m.measureText(d.model).width)));
    const labX = 22 + labW;                 // right edge of the model names
    const P1L = labX + 18, P2R = CW - 30, GX = 70;
    const plotW = (P2R - P1L - GX) / 2;
    const P1R = P1L + plotW, P2L = P1R + GX;
    const rowTop = HDR + 8 + PT, plotBot = rowTop + N * ROW;
    const TOTAL_H = plotBot + AX + 12;
    const rowY = i => rowTop + i * ROW + ROW / 2;

    this._layout = { orient: 'vertical', data, N, maxP, maxI, CW, TOTAL_H,
                     ROW, barH, rowTop, plotBot, rowY, labX, P1L, P1R, P2L, P2R, plotW };

    const b = this._resetCanvases(CW, TOTAL_H);
    this._drawHeader(b, CW, MR);

    const drawPanel = (x0, x1, pL, vals, maxV, title, axLbl, ct, cb2, fmtFn) => {
      b.fillStyle = '#1e293b';
      b.beginPath(); b.roundRect(x0, HDR + 8, x1 - x0, TOTAL_H - HDR - 14, 12); b.fill();
      b.fillStyle = '#f1f5f9'; b.font = 'bold 13px Segoe UI,Arial'; b.textAlign = 'center';
      b.fillText(title, pL + plotW / 2, HDR + 32);
      for (let g = 0; g <= 5; g++) {
        const gx = pL + (g / 5) * plotW;
        b.strokeStyle = 'rgba(148,163,184,0.1)'; b.lineWidth = 1;
        b.beginPath(); b.moveTo(gx, rowTop); b.lineTo(gx, plotBot); b.stroke();
        b.fillStyle = '#64748b'; b.font = '11px Arial'; b.textAlign = 'center';
        b.fillText(fmtFn(maxV * g / 5), gx, plotBot + 16);
      }
      b.fillStyle = '#94a3b8'; b.font = '12px Arial'; b.textAlign = 'center';
      b.fillText(axLbl, pL + plotW / 2, plotBot + 36);
      b.strokeStyle = '#334155'; b.lineWidth = 1.5;
      b.beginPath(); b.moveTo(pL, rowTop); b.lineTo(pL, plotBot); b.lineTo(pL + plotW, plotBot); b.stroke();
      vals.forEach((v, i) => {
        // A null value (no published price) is a zero-length bar labelled n/a.
        const na = v === null;
        const bw = na ? 0 : (v / maxV) * plotW, by = rowY(i) - barH / 2;
        if (!na) {
          const gr = b.createLinearGradient(pL, 0, pL + bw, 0);
          gr.addColorStop(0, cb2); gr.addColorStop(1, ct);
          b.fillStyle = gr; b.beginPath(); b.roundRect(pL, by, bw, barH, [0, 3, 3, 0]); b.fill();
        }
        b.fillStyle = na ? '#64748b' : '#e2e8f0'; b.font = 'bold 10px Arial';
        b.textAlign = 'left'; b.textBaseline = 'middle';
        b.fillText(na ? 'n/a' : fmtFn(v), pL + bw + 8, rowY(i));   // clears the marker dot
        b.textBaseline = 'alphabetic';
      });
    };

    drawPanel(6, P1R + 20, P1L, data.map(d => d.intel), maxI,
      'Artificial Analysis Intelligence Index (AAII)', 'Intelligence Score',
      '#818cf8', '#312e81', v => Math.round(v) + '');
    drawPanel(P2L - 20, CW - 6, P2L, data.map(d => d.price), maxP,
      'Blended Price (USD / 1M Tokens)', 'USD / 1M Tokens',
      '#fb923c', '#7c2d12', v => '$' + v.toFixed(2));

    // Connectors between the two panels, then the model names with their dots.
    for (let i = 0; i < N; i++) {
      b.strokeStyle = 'rgba(51,65,85,0.4)'; b.setLineDash([2, 5]); b.lineWidth = 1;
      b.beginPath(); b.moveTo(P1R + 20, rowY(i)); b.lineTo(P2L - 20, rowY(i)); b.stroke();
      b.setLineDash([]);
      b.fillStyle = data[i].open ? '#4ade80' : '#f87171';
      b.beginPath(); b.arc(P1L - 9, rowY(i), 3, 0, Math.PI * 2); b.fill();
      this._drawLabel(b, i, null);
    }
  },

  // Draw one model name at its axis position. With `color` set, the name gets
  // the high-contrast highlight box, outlined in that comparison line's color.
  _drawLabel(ctx, i, color) {
    const L = this._layout, d = L.data[i];
    ctx.save();
    if (L.orient === 'vertical') {
      ctx.translate(L.labX, L.rowY(i));
    } else {
      ctx.translate(L.cxFn(i), L.c2Y + L.CH + 12); ctx.rotate(-Math.PI / 2);
    }
    ctx.font = (color || d.open ? 'bold ' : '') + '11px Arial';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    if (color) {
      const hi = d.open ? this.LABEL_HI.open : this.LABEL_HI.closed;
      const w = ctx.measureText(d.model).width;
      ctx.fillStyle = hi.bg;
      ctx.beginPath(); ctx.roundRect(-w - 5, -8, w + 9, 16, 3); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = hi.fg;
    } else {
      ctx.fillStyle = d.open ? '#4ade80' : '#f87171';
    }
    ctx.fillText(d.model, 0, 0);
    ctx.restore();
  },

  // ── Hover / crosshair ─────────────────────────────────────────────────────
  // Map a mouse event to a model index, or -1 if outside the plot area.
  _idxFromEvent(e) {
    if (!this._layout) return -1;
    const L = this._layout;
    const r = document.getElementById('hit').getBoundingClientRect();
    if (L.orient === 'vertical') {
      const cy = (e.clientY - r.top) / (r.height / L.TOTAL_H);
      if (cy < L.rowTop || cy > L.plotBot) return -1;
      return Math.max(0, Math.min(L.N-1, Math.floor((cy - L.rowTop) / L.ROW)));
    }
    const { CW, ML, MR, N, stepX } = L;
    const cx = (e.clientX - r.left) / (r.width / CW);
    if (cx < ML || cx > CW-MR) return -1;
    return Math.max(0, Math.min(N-1, Math.floor((cx-ML)/stepX)));
  },

  bindHover() {
    const hitEl = document.getElementById('hit');

    // Press-drag-release to place a comparison line. Releasing on top of an
    // existing line removes it, so the same gesture both adds and deletes.
    hitEl.onmousedown = (e) => {
      const idx = this._idxFromEvent(e);
      if (idx < 0) return;
      this.dragging = true;
      this.lastIdx = idx;
      this._render();
      e.preventDefault();          // don't start a text/canvas selection
    };

    hitEl.onmousemove = (e) => {
      const idx = this._idxFromEvent(e);
      if (this.dragging) {         // scrubbing — preview follows the cursor
        if (idx >= 0 && idx !== this.lastIdx) { this.lastIdx = idx; this._render(); }
        return;
      }
      if (idx === this.hoverIdx) return;
      this.hoverIdx = idx;
      if (!this.rafPending) {
        this.rafPending = true;
        requestAnimationFrame(() => { this._render(); this.rafPending = false; });
      }
    };

    hitEl.onmouseleave = () => {
      if (this.dragging) return;   // keep the preview while dragging
      this.hoverIdx = -1;
      this._render();
    };
  },

  // Called on mouseup anywhere (bound once in init) so releasing outside the
  // chart still commits at the last scrubbed position. Toggles a line there.
  endDrag() {
    if (!this.dragging) return;
    this.dragging = false;
    const idx = this.lastIdx;
    this.lastIdx = -1;
    if (idx < 0) return;
    const pos = this.pins.indexOf(idx);
    if (pos >= 0) this.pins.splice(pos, 1);   // dropped on an existing line → remove
    else this.pins.push(idx);                 // new column → add a comparison line
    this._render();
  },

  clearPins() {
    this.pins = [];
    this.dragging = false;
    this.hoverIdx = -1;
    this.lastIdx = -1;
    this._render();
  },

  // hex (#rrggbb) → rgba() string at the given alpha.
  _rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  },

  // Repaint the overlay: every pinned line plus the transient hover/drag preview.
  _render() {
    if (!this._layout) return;
    const { CW, TOTAL_H } = this._layout;
    const h = document.getElementById('hit').getContext('2d');
    h.clearRect(0, 0, CW, TOTAL_H);
    this.pins.forEach((idx, order) => this._drawMarker(idx, this.colorFor(order), order, true));
    const preview = this.dragging ? this.lastIdx : this.hoverIdx;
    if (preview >= 0 && !this.pins.includes(preview)) {
      this._drawMarker(preview, '#e2e8f0', this.pins.length, false);
    }
  },

  // Draw one model's line: just a colored vertical rule through both charts,
  // its two bars outlined, and a dot at each bar top. No text — the bars and the
  // axis label underneath already carry the values and the name.
  _drawMarker(idx, color, order, pinned) {
    const L = this._layout;
    const h = document.getElementById('hit').getContext('2d');
    if (idx < 0 || idx >= L.data.length) return;
    if (L.orient === 'vertical') this._drawMarkerV(h, idx, color, pinned);
    else this._drawMarkerH(h, idx, color, pinned);
    this._drawLabel(h, idx, color);   // highlight the model name on the axis
  },

  // Vertical rule through both column charts (horizontal orientation).
  _drawMarkerH(h, idx, color, pinned) {
    const { data, maxP, maxI, c1Y, c2Y, CH, barW, mxFn, cxFn } = this._layout;
    const d = data[idx];
    const x = cxFn(idx), bx = mxFn(idx);
    const topY = c1Y, botY = c2Y + CH;
    const by1 = c1Y + CH - (d.price === null ? 0 : (d.price / maxP) * CH);
    const by2 = c2Y + CH - (d.intel / maxI) * CH;

    h.globalAlpha = pinned ? 1 : 0.6;

    // Vertical line — solid when pinned, dashed for the hover/drag preview.
    h.strokeStyle = color; h.lineWidth = pinned ? 2 : 1.5;
    h.setLineDash(pinned ? [] : [5, 4]);
    h.beginPath(); h.moveTo(x, topY); h.lineTo(x, botY); h.stroke();
    h.setLineDash([]);

    // Outline the two bars in the line's color (no fill text).
    h.strokeStyle = color; h.lineWidth = 2;
    h.strokeRect(bx - 1, by1 - 1, barW + 2, (c1Y + CH) - by1 + 2);
    h.strokeRect(bx - 1, by2 - 1, barW + 2, (c2Y + CH) - by2 + 2);

    // Dot at each bar top.
    [by1, by2].forEach(dy => {
      h.fillStyle = color; h.beginPath(); h.arc(x, dy, 4, 0, Math.PI * 2); h.fill();
      h.strokeStyle = '#fff'; h.lineWidth = 1.5; h.stroke();
    });

    h.globalAlpha = 1;
  },

  // Horizontal rule through both row charts (vertical orientation).
  _drawMarkerV(h, idx, color, pinned) {
    const { data, maxP, maxI, rowY, barH, P1L, P2L, P2R, plotW } = this._layout;
    const d = data[idx];
    const y = rowY(idx), by = y - barH / 2;
    const bw1 = (d.intel / maxI) * plotW;
    const bw2 = d.price === null ? 0 : (d.price / maxP) * plotW;

    h.globalAlpha = pinned ? 1 : 0.6;

    h.strokeStyle = color; h.lineWidth = pinned ? 2 : 1.5;
    h.setLineDash(pinned ? [] : [5, 4]);
    h.beginPath(); h.moveTo(P1L, y); h.lineTo(P2R, y); h.stroke();
    h.setLineDash([]);

    h.strokeStyle = color; h.lineWidth = 2;
    h.strokeRect(P1L - 1, by - 1, bw1 + 2, barH + 2);
    h.strokeRect(P2L - 1, by - 1, bw2 + 2, barH + 2);

    [P1L + bw1, P2L + bw2].forEach(dx => {
      h.fillStyle = color; h.beginPath(); h.arc(dx, y, 4, 0, Math.PI * 2); h.fill();
      h.strokeStyle = '#fff'; h.lineWidth = 1.5; h.stroke();
    });

    h.globalAlpha = 1;
  },

  // ── Build the export image ────────────────────────────────────────────────
  // Composite the base chart with the overlay (locked crosshair + caption) so the
  // highlight is included in the output.
  _composite() {
    const base = document.getElementById('base');
    const hit  = document.getElementById('hit');
    const out = document.createElement('canvas');
    out.width = base.width; out.height = base.height;
    const ctx = out.getContext('2d');
    ctx.drawImage(base, 0, 0);
    ctx.drawImage(hit, 0, 0);
    return out;
  },

  _btnFlash(msg) {
    const btn = document.getElementById('export-btn');
    if (btn._reset) clearTimeout(btn._reset);
    if (!btn._orig) btn._orig = btn.textContent;
    btn.textContent = msg;
    btn._reset = setTimeout(() => { btn.textContent = btn._orig; btn._orig = null; }, 1800);
  },

  // ── Copy chart to clipboard as PNG (falls back to download if blocked) ─────
  async copyPNG() {
    const out = this._composite();
    try {
      // Passing a Promise<Blob> to ClipboardItem preserves the click's user-activation.
      const item = new ClipboardItem({
        'image/png': new Promise(res => out.toBlob(res, 'image/png'))
      });
      await navigator.clipboard.write([item]);
      this._btnFlash('✅ Copied!');
    } catch (e) {
      console.warn('Clipboard copy failed, downloading instead:', e);
      out.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'llm-leaderboard-' + new Date().toISOString().slice(0,10) + '.png';
        a.click();
        URL.revokeObjectURL(a.href);
      }, 'image/png');
      this._btnFlash('⬇ Saved (clipboard blocked)');
    }
  },

  // ── Remembered control settings (per browser) ─────────────────────────────
  // filterCreator is applied in populateCreatorFilter, because its options only
  // exist after the data loads.
  PREF_IDS: ['orient', 'topN', 'sortBy', 'filterOpen', 'filterCreator', 'includeNoPrice'],
  prefs: {},

  loadPrefs() {
    try { this.prefs = JSON.parse(localStorage.getItem('llmlb-prefs')) || {}; } catch (e) { this.prefs = {}; }
    try { this.prefs.orient ??= localStorage.getItem('llmlb-orient') ?? undefined; } catch (e) {}   // older key
    for (const id of this.PREF_IDS) {
      const el = document.getElementById(id), v = this.prefs[id];
      if (v === undefined || id === 'filterCreator') continue;
      if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
    }
    document.getElementById('topNVal').textContent = document.getElementById('topN').value;
  },

  savePrefs() {
    for (const id of this.PREF_IDS) {
      const el = document.getElementById(id);
      this.prefs[id] = el.type === 'checkbox' ? el.checked : el.value;
    }
    try { localStorage.setItem('llmlb-prefs', JSON.stringify(this.prefs)); } catch (e) {}
  },

  // ── Sidebar collapse (remembered per browser) ─────────────────────────────
  toggleSidebar(collapsed) {
    const sb = document.getElementById('sidebar');
    const c = typeof collapsed === 'boolean' ? collapsed : !sb.classList.contains('collapsed');
    sb.classList.toggle('collapsed', c);
    document.getElementById('sb-toggle').textContent = c ? '☰' : '◀';
    try { localStorage.setItem('llmlb-sidebar', c ? '1' : '0'); } catch (e) {}
  },

  // ── Refresh ───────────────────────────────────────────────────────────────
  async refresh() {
    await this.fetchData();
  },

  // ── Init ──────────────────────────────────────────────────────────────────
  init() {
    // Build stamp: replaced with the commit SHA + time at deploy; left as the
    // raw token when served unstamped (local dev).
    const buildEl = document.getElementById('build');
    buildEl.textContent = buildEl.textContent.includes('__') ? 'dev build' : 'build ' + buildEl.textContent;

    try { if (localStorage.getItem('llmlb-sidebar') === '1') this.toggleSidebar(true); } catch (e) {}

    // Control settings: restored from the last visit, saved on every change.
    this.loadPrefs();
    document.getElementById('topN').addEventListener('input', e => {
      document.getElementById('topNVal').textContent = e.target.value;
      this.savePrefs();
      this.draw();
    });
    for (const id of ['orient', 'sortBy', 'filterOpen', 'filterCreator', 'includeNoPrice']) {
      document.getElementById(id).addEventListener('change', () => { this.savePrefs(); this.draw(); });
    }

    // Lock the crosshair when the mouse is released anywhere (even outside the chart)
    document.addEventListener('mouseup', () => this.endDrag());
    // Esc releases a locked crosshair
    document.addEventListener('keydown', e => { if (e.key === 'Escape') this.clearPins(); });

    // Auto-refresh
    setInterval(() => this.refresh(), REFRESH_MS);

    // Render the embedded snapshot immediately so the charts are never blank,
    // then attempt a live fetch to replace it.
    this.loadSnapshot();
    this.fetchData();
  }
};

app.init();
</script>
</body>
</html>
